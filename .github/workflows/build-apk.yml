name: Build APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP if provided
        run: |
          if [ -f SshVpn-review-fixed.zip ]; then
            unzip -o SshVpn-review-fixed.zip
          elif [ -f sshvpn-source-for-github.zip ]; then
            unzip -o sshvpn-source-for-github.zip
          elif [ -f source.zip ]; then
            unzip -o source.zip
          fi
          if [ -d SshVpn ]; then
            cp -a SshVpn/. .
          fi

      - name: Patch Kotlin compile errors in source ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/main/java/com/godarmx/ssh/ui/App.kt")
          if app.exists():
              text = app.read_text()
              old = "Card(\n                    Modifier.fillMaxWidth(), onClick = { onUse(p) },"
              new = "Card(\n                    onClick = { onUse(p) }, modifier = Modifier.fillMaxWidth(),"
              if old in text:
                  text = text.replace(old, new, 1)
                  app.write_text(text)
                  print("Fixed Material3 Card argument order")
              else:
                  print("Card argument pattern not found; leaving source unchanged")

          service = Path("app/src/main/java/com/godarmx/ssh/vpn/SshTunnelService.kt")
          if service.exists():
              text = service.read_text()
              if "sslFactory(insecure)" in text and "private fun sslFactory(" not in text:
                  marker = "    /** Plain HTTP CONNECT through a proxy"
                  helper = '''    private fun sslFactory(insecure: Boolean): SSLSocketFactory {
          val context = SSLContext.getInstance("TLS")
          val trustManagers: Array<javax.net.ssl.TrustManager>? =
              if (insecure) arrayOf(object : X509TrustManager {
                  override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                  override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                  override fun getAcceptedIssuers(): Array<X509Certificate> = emptyArray()
              }) else null
          context.init(null, trustManagers, SecureRandom())
          return context.socketFactory
      }

'''
                  if marker not in text:
                      raise SystemExit("Could not find insertion point for sslFactory()")
                  text = text.replace(marker, helper + marker, 1)
                  service.write_text(text)
                  print("Added missing sslFactory() implementation")
      PY

      - name: Check Android source
        run: |
          test -f settings.gradle.kts || { echo "::error::Missing settings.gradle.kts."; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::Missing app/build.gradle.kts."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build hev-socks5-tunnel native libraries
        run: |
          mkdir -p hev
          git clone --recursive --depth 1 --shallow-submodules "$HEV_REPO" hev/jni
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j"$(nproc)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p ../app/src/main/jniLibs/$abi
            cp libs/$abi/libhev-socks5-tunnel.so ../app/src/main/jniLibs/$abi/
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
